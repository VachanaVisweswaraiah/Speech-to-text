version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: speech-to-text
    ports:
      - "8501:8501"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      STREAMLIT_SERVER_HEADLESS: "true"
      STREAMLIT_SERVER_PORT: "8501"
      LOG_LEVEL: "INFO"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    networks:
      - speech-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

networks:
  speech-network:
    driver: bridge

volumes:
  data:
  logs:
